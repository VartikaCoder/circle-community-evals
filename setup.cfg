[metadata]
name = circle-community-evals
version = 0.1.0
description = A simulated eval harness for a Circle-style community admin agent

[options]
python_requires = >=3.9
package_dir =
    = src
packages = find:

[options.packages.find]
where = src

[options.extras_require]
claude =
    anthropic>=0.40.0

[options.entry_points]
console_scripts =
    circle-eval = circle_eval.runner:main
    circle-compare-claude = circle_eval.compare:main

[tool:pytest]
pythonpath = src
testpaths = tests
