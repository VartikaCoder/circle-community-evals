name: Community agent evals

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  eval:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.9'
      - run: pip install -e '.[claude]' pytest
      - run: pytest -q
      - run: circle-eval --output results/deterministic.json
      - uses: actions/upload-artifact@v4
        with:
          name: eval-results
          path: results/
